{% extends "base.html" %}
{% block title %}Log in — ShopFast{% endblock %}

{% block content %}
<div class="page auth-page">
  <h1>Log in</h1>
  <form method="post">
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p>No account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
</div>
{% endblock %}
